name: TeddyPups frontend tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend unit and component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run focused Phase 5 public-page and route tests
        run: npx vitest run src/pages/GoneHomePage.test.jsx src/pages/HappyFamiliesPage.test.jsx src/pages/ContactPage.test.jsx src/app/App.test.jsx src/components/puppies/PuppyMascot.test.jsx
      - name: Run complete frontend test suite
        run: npm test
      - name: Build frontend for production
        run: npm run build
